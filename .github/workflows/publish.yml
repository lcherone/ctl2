name: Publish GitHub Package

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lcherone'
      - name: Use the declared npm version
        run: npm install --global npm@11.21.1
      - name: Install exact dependencies
        run: npm ci
      - name: Match package version to release tag
        run: npm run release:check
      - name: Run complete quality gate
        run: npm run check
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Inspect publishable package
        run: npm pack --dry-run --ignore-scripts
      - name: Publish immutable package version
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
