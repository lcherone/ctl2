name: Bug report
description: Report a reproducible codec, schema, package, or documentation defect.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private production payloads. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: CTL2 version
      description: Exact package version, release tag, or commit SHA.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node or browser version and ESM/CommonJS usage.
      placeholder: Node 22.22.2, ESM
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Sanitized task or payload plus the smallest code needed to reproduce the problem.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and private data from the reproduction.
          required: true
        - label: I checked the latest release and existing issues.
          required: true
